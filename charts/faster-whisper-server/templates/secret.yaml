{{- if and .Values.fasterWhisper.apiKey.enabled .Values.fasterWhisper.apiKey.value -}}
{{/*
Only rendered when the key is supplied as a literal. With `existingSecret` the
operator owns the Secret and this chart must not create, and therefore must not
later delete, an object it does not own.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-api-key" (include "faster-whisper-server.fullname" .) }}
  labels:
    {{- include "faster-whisper-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.fasterWhisper.apiKey.value | quote }}
{{- end }}
