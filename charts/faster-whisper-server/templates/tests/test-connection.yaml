apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "faster-whisper-server.fullname" . }}-test-connection"
  labels:
    {{- include "faster-whisper-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '-q'
        - '-O'
        - '-'
        {{- if .Values.tls.enabled }}
        # The certificate is self-signed unless one was supplied, and this test
        # checks reachability, not trust.
        - '--no-check-certificate'
        {{- end }}
        # /health is unauthenticated and returns 200 as soon as the pod serves.
        - '{{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://{{ include "faster-whisper-server.fullname" . }}:{{ .Values.fasterWhisper.port }}/health'
  restartPolicy: Never
